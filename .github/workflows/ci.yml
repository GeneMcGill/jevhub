name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  version-and-readme:
    name: Version train + README discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install deps (astro) so the site can build, then verify version train.
      - name: Install dependencies
        run: npm install

      # Release-train guard: package.json.version === CHANGELOG === README badges.
      - name: Version coherence
        run: node tools/version-check.mjs

      # Static build sanity (Astro 5).
      - name: Build
        run: npm run build